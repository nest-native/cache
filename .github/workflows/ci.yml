name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Build the core first so the adapter resolves its emitted types.
      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Build adapter (@nest-native/cache)
        run: npm run build --workspace @nest-native/cache

      - name: Typecheck core
        run: npm run typecheck --workspace @stalefree/core

      - name: Typecheck adapter
        run: npm run typecheck --workspace @nest-native/cache

  package-test-node-24:
    name: Package tests/coverage (Node 24)
    runs-on: ubuntu-latest
    # The second supported Node major runs the suites too, not only the
    # build/typecheck matrix (package-quality is the Node 22 run). No external
    # DB services: the core suite is fully hermetic (in-memory store +
    # in-process bus), and the gated store/bus round-trips live in
    # store-integration.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run core tests with coverage
        run: npm run test:cov

      # The adapter tests import `@stalefree/core` by package name, which
      # resolves to packages/core/dist — build it first.
      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Run adapter tests
        run: npm run test:nestjs

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run core tests with coverage
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      # The adapter tests import `@stalefree/core` by package name, which
      # resolves to packages/core/dist — build it first.
      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Run adapter tests
        run: npm run test:nestjs

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  store-integration:
    name: Store integration (real Postgres + MySQL)
    runs-on: ubuntu-latest
    # The only job with DB services: it runs the gated store/bus round-trips
    # (test/integration), which skip everywhere else because
    # STALEFREE_POSTGRES_URL and STALEFREE_MYSQL_URL are unset. The main suite
    # stays hermetic.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stalefree
          POSTGRES_USER: stalefree
          POSTGRES_PASSWORD: stalefree
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stalefree -d stalefree"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stalefree
          MYSQL_ROOT_PASSWORD: stalefree-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pstalefree-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run gated store round-trips
        run: npm run test:integration
        env:
          STALEFREE_POSTGRES_URL: postgres://stalefree:stalefree@127.0.0.1:5432/stalefree
          STALEFREE_MYSQL_URL: mysql://root:stalefree-ci-password@127.0.0.1:3306/stalefree

  nestjs-compat:
    name: NestJS ${{ matrix.nest.label }} compatibility (Node 22)
    runs-on: ubuntu-latest
    # The adapter's published peer range is ^10 || ^11 || ^12. The
    # devDependencies and the lockfile every other job installs stay on the
    # 11.x in the middle of that range, so this matrix is what makes its ENDS
    # tested claims: each leg installs one end on top of the lockfile with
    # --no-save and runs the adapter typecheck and both suites against it. It
    # replaces two earlier lanes: a typecheck-only 10/11 matrix that pinned
    # with --legacy-peer-deps (a leg that needs that flag is reporting an
    # unsupported combination, not typechecking a supported one) and the
    # blocking 12 leg. The sample is bare Express with no @nestjs/* anywhere
    # (the neutrality proof), so it has nothing to say here.
    #
    # Two things keep a leg honest, because npm makes it easy to run a suite
    # against a tree that is not the one you asked for:
    # - --workspaces --include-workspace-root, even though only the root
    #   declares @nestjs/*: a root-only install (--workspace-root) fails
    #   ERESOLVE, because npm swaps the four peer-linked packages one at a
    #   time inside the 11 tree and trips over platform-express@11 still
    #   peering on core@^11; declaring the specs from every workspace makes
    #   npm re-resolve the set as a whole.
    # - scripts/check-nestjs-resolution.mjs proves the version from inside
    #   every workspace (exactly, at the floors), fails on nested copies, and
    #   checks every peer range in the NestJS ecosystem against the tree the
    #   suite will run on. That final-tree check is the gate; npm prints
    #   `ERESOLVE overriding peer dependency` and exits 0 both for a real
    #   override and for transitional states that end coherent, so the
    #   install log is diagnosis only.
    # Node is not a dimension here on purpose: 22 floats to a current 22.x,
    # which is what require(esm) on the 12 end needs (>=22.12, which the
    # @nestjs/* engines field — ">= 20" — does not encode), and the build
    # job already covers 24.
    strategy:
      fail-fast: false
      matrix:
        nest:
          # 10.3.2, not 10.0.0: @nestjs/common 10.0.0 through 10.3.1 peer on
          # reflect-metadata ^0.1.12, and this repo pins ^0.2.2, so 10.3.2 —
          # the first 10.x whose peer admits 0.2 — is the oldest 10 that
          # installs here at all. The adapter builds only on stable Nest
          # primitives, so nothing it uses was added by a later 10.x. Not a
          # peer-range correction: a consumer on reflect-metadata 0.2 cannot
          # reach 10.0–10.3.1 either.
          - { label: '10 floor', spec: '10.3.2' }
          # 11.0.0 is the oldest graph the 11 line can produce; same
          # stable-primitives reason. Both floors are pinned exactly so a
          # downgrade that silently no-ops cannot pass as a floor run.
          - { label: '11 floor', spec: '11.0.0' }
          # ^12.0.0 floats, so a new 12.x patch is tested on the next run.
          - { label: '12', spec: '^12.0.0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS ${{ matrix.nest.label }} (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            "@nestjs/common@${{ matrix.nest.spec }}" \
            "@nestjs/core@${{ matrix.nest.spec }}" \
            "@nestjs/platform-express@${{ matrix.nest.spec }}" \
            "@nestjs/testing@${{ matrix.nest.spec }}"

      - name: Prove every workspace resolves NestJS ${{ matrix.nest.label }}
        run: node scripts/check-nestjs-resolution.mjs "${{ matrix.nest.spec }}"

      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Typecheck adapter against NestJS ${{ matrix.nest.label }}
        run: npm run typecheck --workspace @nest-native/cache

      - name: Run core tests against NestJS ${{ matrix.nest.label }}
        run: npm test

      - name: Run adapter tests against NestJS ${{ matrix.nest.label }}
        run: npm run test:nestjs

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build
