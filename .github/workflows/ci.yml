name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Build the core first so the adapter resolves its emitted types.
      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Build adapter (@nest-native/cache)
        run: npm run build --workspace @nest-native/cache

      - name: Typecheck core
        run: npm run typecheck --workspace @stalefree/core

      - name: Typecheck adapter
        run: npm run typecheck --workspace @nest-native/cache

  package-test-node-24:
    name: Package tests/coverage (Node 24)
    runs-on: ubuntu-latest
    # The second supported Node major runs the suites too, not only the
    # build/typecheck matrix (package-quality is the Node 22 run). No external
    # DB services: the core suite is fully hermetic (in-memory store +
    # in-process bus), and the gated store/bus round-trips live in
    # store-integration.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run core tests with coverage
        run: npm run test:cov

      # The adapter tests import `@stalefree/core` by package name, which
      # resolves to packages/core/dist — build it first.
      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Run adapter tests
        run: npm run test:nestjs

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run core tests with coverage
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      # The adapter tests import `@stalefree/core` by package name, which
      # resolves to packages/core/dist — build it first.
      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Run adapter tests
        run: npm run test:nestjs

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  store-integration:
    name: Store integration (real Postgres + MySQL)
    runs-on: ubuntu-latest
    # The only job with DB services: it runs the gated store/bus round-trips
    # (test/integration), which skip everywhere else because
    # STALEFREE_POSTGRES_URL and STALEFREE_MYSQL_URL are unset. The main suite
    # stays hermetic.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stalefree
          POSTGRES_USER: stalefree
          POSTGRES_PASSWORD: stalefree
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stalefree -d stalefree"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stalefree
          MYSQL_ROOT_PASSWORD: stalefree-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pstalefree-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run gated store round-trips
        run: npm run test:integration
        env:
          STALEFREE_POSTGRES_URL: postgres://stalefree:stalefree@127.0.0.1:5432/stalefree
          STALEFREE_MYSQL_URL: mysql://root:stalefree-ci-password@127.0.0.1:3306/stalefree

  nestjs-compat:
    name: NestJS ${{ matrix.nest-major }} backward-compat (adapter typecheck)
    runs-on: ubuntu-latest
    # The adapter builds only on stable Nest primitives (DynamicModule and
    # plain injectable providers), so it must typecheck against every
    # supported major. 10 and 11 are the older end of the range; the newest
    # major gets the full run (typecheck + both suites) in nestjs-latest-major.
    strategy:
      fail-fast: false
      matrix:
        nest-major: ['10', '11']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Pin NestJS to major ${{ matrix.nest-major }}
        # --legacy-peer-deps: an in-place major downgrade always fights the
        # installed ^11 peer web (platform-express/testing at the root). This
        # lane exists to TYPECHECK the adapter against the older typings; peer
        # strictness during the pin is noise, not signal.
        run: npm install --no-save --legacy-peer-deps "@nestjs/common@^${{ matrix.nest-major }}" "@nestjs/core@^${{ matrix.nest-major }}"

      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Typecheck adapter against NestJS ${{ matrix.nest-major }}
        run: npm run typecheck --workspace @nest-native/cache

  nestjs-latest-major:
    name: NestJS 12 compatibility (Node 22)
    runs-on: ubuntu-latest
    # The adapter's published peer range is ^10 || ^11 || ^12, but the
    # devDependencies and the lockfile every other job installs stay on 11.x so
    # the default suite keeps testing the older end. This leg installs 12 on
    # top of that lockfile with --no-save and runs the adapter typecheck and
    # both suites, which makes the 12 end of the range a tested claim rather
    # than an assumption. --workspaces --include-workspace-root is load-
    # bearing even though only the root declares @nestjs/*: a root-only
    # install (--workspace-root) fails ERESOLVE, because npm swaps the four
    # peer-linked packages one at a time inside the 11 tree and trips over
    # platform-express@11 still peering on core@^11; declaring the specs from
    # every workspace too makes npm re-resolve the set as a whole (verified
    # locally on a fresh `npm ci` tree, 2026-09-06). The proof step below
    # fails on a nested 11 instead of passing silently. The sample is bare
    # Express with no @nestjs/* anywhere (the neutrality proof), so it has
    # nothing to say about 12 and is not part of this leg. This job replaced
    # the informational 12-alpha canary once 12 went stable (2026-08-27); it
    # has no continue-on-error, so unlike the canary a 12 breakage fails the
    # run. Node 22 here resolves to the newest 22.x, above NestJS 12's own
    # floor of 22.12 (its require(esm) requirement, which the @nestjs/*
    # engines field — ">= 20" — does not encode).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS 12 (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            @nestjs/common@^12.0.0 \
            @nestjs/core@^12.0.0 \
            @nestjs/platform-express@^12.0.0 \
            @nestjs/testing@^12.0.0

      - name: Prove the adapter resolves NestJS 12
        # NestJS 12 does not export ./package.json, so the version is read next
        # to the resolved entry point, from inside the adapter workspace.
        run: |
          cd packages/nestjs && node -e "
            const path = require('node:path');
            const root = path.dirname(require.resolve('@nestjs/core'));
            const { version } = require(path.join(root, 'package.json'));
            console.log(process.cwd(), '@nestjs/core', version, '<-', root);
            if (!version.startsWith('12.')) process.exit(1);
          "

      - name: Build core (@stalefree/core)
        run: npm run build --workspace @stalefree/core

      - name: Typecheck adapter against NestJS 12
        run: npm run typecheck --workspace @nest-native/cache

      - name: Run core tests against NestJS 12
        run: npm test

      - name: Run adapter tests against NestJS 12
        run: npm run test:nestjs

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build
